version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs, so Dependabot rewrites both the SHA
    # and its trailing version comment on every bump.
    groups:
      # Majors travel separately. Everything here auto-merges once CI passes,
      # and a major that breaks the build would otherwise hold the safe
      # patches hostage in the same pull request.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Without this, Dependabot touches only the three direct requires and
    # leaves the "// indirect" block to move whenever a parent happens to pull
    # it forward. "all" covers both.
    allow:
      - dependency-type: all
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-major:
        patterns:
          - "*"
        update-types:
          - major
