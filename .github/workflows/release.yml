name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint, test, build
        run: |
          ./scripts/ci-container.sh run -- bash -c \
            'golangci-lint run ./... && go test -race -count=1 ./... && go build -o cairnlint .'

  release:
    name: Release
    needs: validate
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          major=$(echo "$latest" | sed 's/v//' | cut -d. -f1)
          minor=$(echo "$latest" | sed 's/v//' | cut -d. -f2)
          patch=$(echo "$latest" | sed 's/v//' | cut -d. -f3)

          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Previous: ${latest} -> Next: ${next} (${BUMP} bump)"

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      # Cross-compiles in the container so the release binaries come from the
      # same pinned-to-latest toolchain the gate used.
      - name: Build binaries
        run: |
          ./scripts/ci-container.sh run -- bash -c '
            mkdir -p dist
            GOOS=linux GOARCH=amd64 go build -o dist/cairnlint-linux-amd64 .
            GOOS=linux GOARCH=arm64 go build -o dist/cairnlint-linux-arm64 .
            GOOS=darwin GOARCH=amd64 go build -o dist/cairnlint-darwin-amd64 .
            GOOS=darwin GOARCH=arm64 go build -o dist/cairnlint-darwin-arm64 .
          '

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
