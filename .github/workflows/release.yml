name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint, test, build
        run: |
          ./scripts/ci-container.sh run -- bash -c \
            'golangci-lint run ./... && go test -race -count=1 ./... && go build -o cairnlint .'

  release:
    name: Release
    needs: validate
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # No step after checkout needs the token except the tag push, which
      # supplies its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          major=$(echo "$latest" | sed 's/v//' | cut -d. -f1)
          minor=$(echo "$latest" | sed 's/v//' | cut -d. -f2)
          patch=$(echo "$latest" | sed 's/v//' | cut -d. -f3)

          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Previous: ${latest} -> Next: ${next} (${BUMP} bump)"

      # The tag push uses GIT_CONFIG_COUNT, which needs git 2.31. Checking
      # before the tag is created keeps an old git from leaving a local tag
      # that never reaches the remote.
      - name: Check git supports GIT_CONFIG_COUNT
        run: |
          probe=$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=release.probe \
            GIT_CONFIG_VALUE_0=ok git config --get release.probe || true)
          if [ "${probe}" != "ok" ]; then
            echo "E: $(git --version) lacks GIT_CONFIG_COUNT; need git 2.31+" >&2
            exit 1
          fi

      # The runner host's global git config supplies the identity and signs
      # tags with its GPG key, so no bot identity is set here: an email with no
      # matching secret key makes the signed tag fail.
      # The token goes through GIT_CONFIG_* env so it stays out of argv and
      # out of any config file on the runner host.
      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "${TAG}" -m "Release ${TAG}"
          auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push origin "${TAG}"

      # Cross-compiles in the container so the release binaries come from the
      # same pinned-to-latest toolchain the gate used.
      - name: Build binaries
        run: |
          ./scripts/ci-container.sh run -- bash -c '
            mkdir -p dist
            GOOS=linux GOARCH=amd64 go build -o dist/cairnlint-linux-amd64 .
            GOOS=linux GOARCH=arm64 go build -o dist/cairnlint-linux-arm64 .
            GOOS=darwin GOARCH=amd64 go build -o dist/cairnlint-darwin-amd64 .
            GOOS=darwin GOARCH=arm64 go build -o dist/cairnlint-darwin-arm64 .
          '

      - name: Create GitHub release # zizmor: ignore[superfluous-actions] runner host has no gh and jobs install nothing on it
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
