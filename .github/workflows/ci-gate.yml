name: CI gate

# Decides whether a pull request may put work on the self-hosted runners.
# Write access on a branch in this repository runs automatically; anything else
# waits for the approval label, which only triage permission or higher can add.
#
# This is not the boundary for untrusted forks. A fork controls this file, so
# this public repository needs Actions "Require approval for all outside
# collaborators" enabled as well.

on:
  workflow_call:
    inputs:
      approval-label:
        description: Label an account with repository access adds to approve a run.
        type: string
        required: false
        default: ci-approved
    outputs:
      allowed:
        description: "true when the self-hosted jobs may run"
        value: ${{ jobs.decide.outputs.allowed }}

permissions:
  contents: read

jobs:
  decide:
    name: decide whether CI may run
    # Nothing is checked out here, but on a fork pull request this job's own
    # shell comes from the fork. See the note at the top of this file.
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          APPROVAL_LABEL: ${{ inputs.approval-label }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          allowed=false
          reason="author ${AUTHOR} has no write access and the pull request carries no ${APPROVAL_LABEL} label"

          # Anything that is not a pull request already required write access to
          # happen at all, so there is nothing left to gate.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            allowed=true
            reason="${EVENT_NAME} event, which already required write access"
          fi

          if [[ "${allowed}" != "true" && "${IS_FORK}" == "false" ]]; then
            case "${ASSOCIATION}" in
              OWNER | MEMBER | COLLABORATOR)
                allowed=true
                reason="author ${AUTHOR} has write access on a branch in this repository"
                ;;
            esac
          fi

          if [[ "${allowed}" != "true" && ",${LABELS}," == *",${APPROVAL_LABEL},"* ]]; then
            allowed=true
            reason="approved by the ${APPROVAL_LABEL} label"
          fi

          echo "allowed=${allowed}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Self-hosted CI gate"
            echo ""
            echo "- allowed: \`${allowed}\`"
            echo "- reason: ${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

          if [[ "${allowed}" != "true" ]]; then
            echo "::notice::CI is held. Someone with repository access can add the ${APPROVAL_LABEL} label to release it."
          fi
