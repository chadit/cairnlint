name: CI gate reset

# Drops the approval label when a pull request gets new commits, so approval
# covers the code someone looked at.
#
# pull_request_target is needed because a fork's own token cannot edit labels.
# Never add a checkout step here.

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  drop-approval:
    name: drop the approval label
    # Skip exactly the pull requests ci-gate.yml auto-allows. Their label is
    # decorative, so stripping it on every push is pure churn.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.pull_request.author_association)
    # pull_request_target runs the base-branch copy, so a fork cannot inject
    # code here. The write-scoped token does sit on the runner while it runs.
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 5
    steps:
      - name: Remove the approval label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVAL_LABEL: ci-approved
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ ",${LABELS}," != *",${APPROVAL_LABEL},"* ]]; then
            echo "I: no ${APPROVAL_LABEL} label to remove"
            exit 0
          fi

          # REST, not `gh pr edit`: that command still queries the deprecated
          # projectCards field and fails outright on older gh builds.
          # A 404 means something else removed the label first.
          gh api --method DELETE \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/${APPROVAL_LABEL}" \
            --silent || {
            echo "I: ${APPROVAL_LABEL} was already gone"
            exit 0
          }
          echo "::notice::New commits dropped the ${APPROVAL_LABEL} label. CI needs a fresh approval."
