name: CI

# Runs on the self-hosted fleet. Every step that touches repository content
# runs inside a container started for that step and removed when it ends, so a
# job installs no tooling and leaves nothing on the runner host.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.pull_request.author_association) ||
      github.event.pull_request.user.login == 'dependabot[bot]')) ||
      contains(github.event.pull_request.labels.*.name, 'ci-approved')
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Network stays on: the module cache is warm across runs but a new
      # dependency still has to be fetched.
      - name: golangci-lint and go vet
        run: |
          ./scripts/ci-container.sh run -- bash -c 'golangci-lint run ./... && go vet ./...'

  test:
    name: Test
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.pull_request.author_association) ||
      github.event.pull_request.user.login == 'dependabot[bot]')) ||
      contains(github.event.pull_request.labels.*.name, 'ci-approved')
    runs-on: [self-hosted, linux, x64, cairnlint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests and build
        run: |
          ./scripts/ci-container.sh run -- bash -c 'go test -race -count=1 ./... && go build -o cairnlint .'
